# Stage 1 skeleton stack: React frontend -> Spring Boot BFF, plus a local
# Keycloak + PostgreSQL that are started and reachable, but not yet wired
# into any login flow.
#
# All credentials below are disposable, LOCAL DEVELOPMENT ONLY values.
# They protect nothing beyond a throwaway local container and must never
# be reused anywhere else.
services:
  keycloak-db:
    image: postgres:18.6-alpine
    environment:
      # LOCAL DEVELOPMENT ONLY - disposable dev credentials, dedicated to
      # the Keycloak database only. Not used by the Spring Boot backend.
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-local-dev-only
    volumes:
      # PostgreSQL 18+ images store data in a version-specific subdirectory
      # under a single /var/lib/postgresql mount point (not
      # /var/lib/postgresql/data as in older image versions).
      - keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      # LOCAL DEVELOPMENT ONLY - disposable Keycloak admin bootstrap
      # credentials for the local container. Never used in production.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-dev-only
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local-dev-only
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Browser-facing hostname/port: Keycloak is reached by the host
      # machine (and, since Stage 2A, redirected to by the browser) at
      # http://localhost:8081 - never via the Docker-internal
      # "keycloak:8080" hostname, which only works container-to-container.
      #
      # Stage 2A fix: previously this used the deprecated Hostname-V1
      # options (bare KC_HOSTNAME + separate KC_HOSTNAME_PORT/
      # KC_HOSTNAME_STRICT_HTTPS), which Keycloak 26 only applies as a
      # legacy compatibility shim on top of its Hostname-V2 provider
      # (startup log explicitly warns: "Hostname v1 options... still in
      # use, please review your configuration"). In practice this caused
      # an inconsistency: the token/JWKS endpoints and the ID token's
      # `iss` claim correctly used http://localhost:8081, but the
      # userinfo endpoint's own bearer-token issuer validation (reached
      # backend-container-side via http://keycloak:8080) instead expected
      # http://localhost:8080 - i.e. it derived the port from the actual
      # internal request instead of the configured KC_HOSTNAME_PORT -
      # which made every login fail with invalid_user_info_response /
      # "Invalid token issuer". Using the single-URL Hostname-V2 syntax
      # below makes the issuer consistent across all endpoints regardless
      # of which internal or external URL was used to reach Keycloak.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl/wget; use a bash /dev/tcp probe
      # against the management health endpoint instead.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      # LOCAL DEVELOPMENT ONLY - disposable confidential-client secret,
      # matching keycloak/import/bff-demo-realm.json's bff-app client.
      # Backend-only: never passed to the frontend service/build.
      KEYCLOAK_CLIENT_SECRET: dev-only-placeholder-secret-CHANGE-ME
      # Browser-facing Keycloak base URL - must match the keycloak
      # service's KC_HOSTNAME below; also Keycloak's fixed `iss` claim,
      # used for ID token issuer validation.
      KEYCLOAK_BROWSER_ISSUER_URI: http://localhost:8081/realms/bff-demo
      # Docker-internal (backend-container-facing) Keycloak base URL, used
      # for the token/userinfo/JWK endpoints - never handed to the browser.
      KEYCLOAK_BACKEND_ISSUER_URI: http://keycloak:8080/realms/bff-demo
      OAUTH2_REDIRECT_URI: http://localhost:5173/login/oauth2/code/bff-app
    depends_on:
      keycloak:
        condition: service_healthy
    # OAuth2 login is now configured: the backend needs Keycloak reachable
    # (for the token/userinfo/JWK endpoints) once a login attempt occurs.
    # It does not call Keycloak at startup (manual ClientRegistrationRepository,
    # no issuer-uri autodiscovery), but requiring Keycloak to be healthy
    # first keeps local startup ordering predictable for the login flow.

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  keycloak_db_data:
