# Stage 1 skeleton stack: React frontend -> Spring Boot BFF, plus a local
# Keycloak + PostgreSQL that are started and reachable, but not yet wired
# into any login flow.
#
# All credentials below are disposable, LOCAL DEVELOPMENT ONLY values.
# They protect nothing beyond a throwaway local container and must never
# be reused anywhere else.
services:
  keycloak-db:
    image: postgres:18.6-alpine
    environment:
      # LOCAL DEVELOPMENT ONLY - disposable dev credentials, dedicated to
      # the Keycloak database only. Not used by the Spring Boot backend.
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-local-dev-only
    volumes:
      # PostgreSQL 18+ images store data in a version-specific subdirectory
      # under a single /var/lib/postgresql mount point (not
      # /var/lib/postgresql/data as in older image versions).
      - keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      # LOCAL DEVELOPMENT ONLY - disposable Keycloak admin bootstrap
      # credentials for the local container. Never used in production.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-dev-only
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local-dev-only
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Browser-facing hostname/port: Keycloak is reached by the host
      # machine (and, in a later stage, redirected to by the browser) at
      # http://localhost:8081 - never via the Docker-internal
      # "keycloak:8080" hostname, which only works container-to-container.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8081"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl/wget; use a bash /dev/tcp probe
      # against the management health endpoint instead.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    # No database, no OAuth2 client configuration yet - Stage 1 backend is
    # self-contained and does not depend on Keycloak being ready.

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  keycloak_db_data:
