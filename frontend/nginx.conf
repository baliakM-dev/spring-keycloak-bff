# Stage 1: serves the built React app and proxies /api to the backend BFF
# container over the Docker-internal network. The browser only ever talks
# to this server (mapped to a host-reachable localhost port by Compose) -
# it never sees the backend's internal Docker hostname directly.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
