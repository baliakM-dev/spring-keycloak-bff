# Stage 1: serves the built React app and proxies /api to the backend BFF
# container over the Docker-internal network. The browser only ever talks
# to this server (mapped to a host-reachable localhost port by Compose) -
# it never sees the backend's internal Docker hostname directly.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # $http_host (not $host): $host strips the port from the original
        # Host header, so the backend would see "Host: localhost" without
        # ":5173" and build absolute redirect URLs (e.g. the OAuth2 login
        # success handler's redirect to "/") that drop the port, sending
        # the browser to http://localhost/ instead of http://localhost:5173/.
        # $http_host preserves the original Host header verbatim.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stage 2A: OAuth2/OIDC login endpoints, proxied to the backend BFF -
    # same header shape as /api/ above.
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/ {
        proxy_pass http://backend:8080/login/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
